<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yoga Enroll Page</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .container {

            border-radius: 22px;
            border: 2px solid rgb(217, 207, 207);
            width: 600px;
            height: 800px;
        }
    </style>
</head>

<body>

    <div class="container mt-5 mb-5 bg-light">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="enroll-card">
                    <h2 class="text-center yoga-title mb-4">Enroll for Yoga Classes</h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" placeholder="Enter your phone number" required>
                        </div>

  <div class="mb-3">       
      <label class="form-label">Preferred Yoga Batch</label>
                            <select class="form-select" required>
                                <option selected disabled>Select a Batch</option>
                                <option>6:00 AM - Morning Yoga</option>
                                <option>8:00 AM - Power Yoga</option>
                                <option>5:00 PM - Evening Relaxation Yoga</option>
                                <option>7:00 PM - Meditation & Breathing</option>
                            </select>
                        </div>

<div class="mb-3">
<label class="form-label">Experience Level</label >
<select class="form-select">
     <option>Beginner</option>
<option>Intermediate</option>
  <option>Advanced</option>
                            </select>
                        </div>
       <div class="mb-3">
                            <label class="form-label">Why do you want to join?</label>
                            <textarea class="form-control" rows="3" placeholder="Write your reason..."></textarea>
                        </div>
 <div class="d-block">
                            <button class="btn btn-success ">Enroll</button>
                        </div>
                    </form>
   </div>

 </div>
        </div>
    </div>

    <a href="yogafitness.html"
        style="position: relative;border-radius: 22px; top: 100px;font-size: small;font-family: cursive;color: rgb(12, 63, 172);top: -800px;left: 600px;text-decoration: none; height: 35px; width: 60px; text-align: center;" class="bg-info d-inline-block" >BACK</a>




</body>

</html>
